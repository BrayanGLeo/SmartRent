spring:
  application:
    name: ms-smartrent-report
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    admin:
      fail-fast: false
      properties:
        request.timeout.ms: 5000
        default.api.timeout.ms: 8000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: report-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
    listener:
      ack-mode: record
      concurrency: 3
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://753ae9df-d5ec-4c6b-8227-b334fc775087.ciamlogin.com/753ae9df-d5ec-4c6b-8227-b334fc775087/discovery/v2.0/keys
          issuer-uri: https://753ae9df-d5ec-4c6b-8227-b334fc775087.ciamlogin.com/753ae9df-d5ec-4c6b-8227-b334fc775087/v2.0

smartrent:
  kafka:
    consumer:
      group-id: report-group
      dlt-group-id: report-group-dlt
      concurrency: 3
    topics:
      rentals: rentals.events
      rentals-dlt: rentals.events-dlt
      catalog: catalog.events
      catalog-dlt: catalog.events-dlt
      partitions: 3
      replicas: 3

server:
  port: 8083
