server.port=8085
spring.application.name=ms-smartrent-cart

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartrent_audit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartrent}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security / Azure AD JWT configuration (CIAM endpoint)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://753ae9df-d5ec-4c6b-8227-b334fc775087.ciamlogin.com/753ae9df-d5ec-4c6b-8227-b334fc775087/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://749dc676-d557-460a-b138-dac9a6744b6e

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Resilience: reintentar conexion si RabbitMQ no esta listo al arrancar
spring.rabbitmq.connection-timeout=10000
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=3000
spring.rabbitmq.template.retry.max-attempts=10
spring.rabbitmq.template.retry.multiplier=1.5
spring.rabbitmq.template.retry.max-interval=30000
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# Logging
logging.level.org.springframework.security=DEBUG
