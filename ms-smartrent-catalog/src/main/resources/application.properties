server.port=${SERVER_PORT:8081}

# PostgreSQL DB Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartrent_audit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartrent}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Deshabilitar auto-configuracion de Azure AD Resource Server de Spring Cloud que fuerza login.microsoftonline.com
spring.cloud.azure.active-directory.enabled=false
spring.cloud.azure.active-directory.credential.client-id=749dc676-d557-460a-b138-dac9a6744b6e
spring.cloud.azure.active-directory.app-id-uri=api://749dc676-d557-460a-b138-dac9a6744b6e

# OAuth2 Resource Server JWT Validation directo con Azure CIAM
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://753ae9df-d5ec-4c6b-8227-b334fc775087.ciamlogin.com/753ae9df-d5ec-4c6b-8227-b334fc775087/discovery/v2.0/keys
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://753ae9df-d5ec-4c6b-8227-b334fc775087.ciamlogin.com/753ae9df-d5ec-4c6b-8227-b334fc775087/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://749dc676-d557-460a-b138-dac9a6744b6e,749dc676-d557-460a-b138-dac9a6744b6e

# Kafka Configuration (Cluster HA de 3 brokers)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.compression-type=gzip
spring.kafka.producer.batch-size=16384
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=15000
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.admin.fail-fast=false
spring.kafka.admin.properties.request.timeout.ms=5000
spring.kafka.admin.properties.default.api.timeout.ms=8000

smartrent.kafka.topics.catalog=catalog.events
smartrent.kafka.topics.catalog-dlt=catalog.events-dlt
smartrent.kafka.topics.partitions=3
smartrent.kafka.topics.replicas=3
smartrent.kafka.topics.catalog-retention-ms=1209600000
smartrent.kafka.topics.catalog-cleanup-policy=compact,delete
