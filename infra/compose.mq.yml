version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smartrent-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartrent-network

networks:
  smartrent-network:
    name: smartrent-network
    driver: bridge
