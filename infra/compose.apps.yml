version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartrent-postgres
    environment:
      POSTGRES_USER: smartrent
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartrent_audit
    ports:
      - "5432:5432"
    networks:
      - smartrent-network
    volumes:
      - pgdata:/var/lib/postgresql/data

