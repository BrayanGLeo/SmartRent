server.port=8080

# Deshabilitar auto-configuracion de Azure AD Resource Server de Spring Cloud que fuerza login.microsoftonline.com
spring.cloud.azure.active-directory.enabled=false

# Client ID del registro del API en Entra ID
spring.cloud.azure.active-directory.credential.client-id=749dc676-d557-460a-b138-dac9a6744b6e

# application ID URI configurado en "Expose an API"
spring.cloud.azure.active-directory.app-id-uri=api://749dc676-d557-460a-b138-dac9a6744b6e

# OAuth2 Resource Server JWT Validation directo con Azure CIAM
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://753ae9df-d5ec-4c6b-8227-b334fc775087.ciamlogin.com/753ae9df-d5ec-4c6b-8227-b334fc775087/discovery/v2.0/keys
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://753ae9df-d5ec-4c6b-8227-b334fc775087.ciamlogin.com/753ae9df-d5ec-4c6b-8227-b334fc775087/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://749dc676-d557-460a-b138-dac9a6744b6e,749dc676-d557-460a-b138-dac9a6744b6e

# Microsoft Graph API Configuration
azure.graph.tenant-id=753ae9df-d5ec-4c6b-8227-b334fc775087
azure.graph.client-id=749dc676-d557-460a-b138-dac9a6744b6e
azure.graph.client-secret=${AZURE_GRAPH_CLIENT_SECRET:}

