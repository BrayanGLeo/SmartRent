<nav class="navbar">
  <div class="logo">
    <a routerLink="/">
      <span class="logo-icon">✨</span> SmartRent
    </a>
  </div>
  
  <ul class="nav-links">
    <li><a routerLink="/catalog" routerLinkActive="active">Catálogo</a></li>
    <li><a routerLink="/about" routerLinkActive="active">Sobre Nosotros</a></li>

    <li *ngIf="authService.userRole() === 'Arrendatario' || authService.userRole() === 'Admin'">
      <a routerLink="/rentals" routerLinkActive="active">Mis Arriendos</a>
    </li>

    <li *ngIf="authService.userRole() === 'JefeBodega' || authService.userRole() === 'Admin'">
      <a routerLink="/rentals" routerLinkActive="active">Gestión Arriendos</a>
    </li>

    <li *ngIf="authService.userRole() === 'Auditor' || authService.userRole() === 'Admin'">
      <a routerLink="/audit" routerLinkActive="active">Auditoría</a>
    </li>
    <li *ngIf="authService.userRole() === 'Admin' || authService.userRole() === 'Auditor'">
      <a routerLink="/reports" routerLinkActive="active">Reportes</a>
    </li>
  </ul>

  <div class="auth-buttons">
    <div class="nav-spinner" *ngIf="authService.isAuthBusy()"></div>

    <ng-container *ngIf="!authService.isAuthBusy()">
      <ng-container *ngIf="authService.account(); else loggedOut">
        <div class="user-profile">
          <div class="avatar">{{ authService.account()?.name?.charAt(0) || 'U' }}</div>
          <div class="user-details">
            <span class="user-name">{{ authService.account()?.name || 'Usuario' }}</span>
            <span class="user-role">{{ authService.userRole() }}</span>
          </div>
        </div>
        <button class="btn-logout" (click)="authService.logout()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Salir
        </button>
      </ng-container>
      <ng-template #loggedOut>
        <button class="btn-login" (click)="authService.login()">Iniciar Sesión</button>
      </ng-template>
    </ng-container>
  </div>
</nav>
