<nav class="navbar">
  <div class="nav-container">
    <a class="brand" routerLink="/">SmartRent</a>
    
    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a *ngIf="loginDisplay" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    </div>

    <div class="auth-buttons">
      <button *ngIf="!loginDisplay" class="btn-primary" (click)="login()">Iniciar Sesión</button>
      <button *ngIf="loginDisplay" class="btn-outline" (click)="logout()">Cerrar Sesión</button>
    </div>
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
